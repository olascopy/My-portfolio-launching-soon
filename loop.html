<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loop - OLED</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,Inter,sans-serif; background:#000; color:#fff; overflow-x:hidden;}
.glass{backdrop-filter:blur(24px) saturate(180%); background:rgba(22,22,24,0.88); border:1px solid rgba(255,255,255,0.12);}

@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-1deg)}75%{transform:rotate(1deg)}}
@keyframes pop{0%{transform:scale(0.92) translateY(20px); opacity:0}60%{transform:scale(1.02)}100%{transform:scale(1); opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes load{0%{width:0}100%{width:100%}}
.wiggle{animation:wiggle .35s ease}
.pop{animation:pop .4s cubic-bezier(0.34,1.56,0.64,1)}

.view{display:none;}
.view.active{display:block;}
#viewFeed.active{max-width:430px; margin:0 auto; min-height:100vh; padding-bottom:96px; background:#000;}
#viewNew.active{position:fixed; inset:0; z-index:100; background:#000; display:flex; flex-direction:column; animation:slideUp .35s cubic-bezier(0.16,1,0.3,1);}
#viewProfile.active{max-width:430px; margin:0 auto; min-height:100vh; padding-bottom:96px; background:#000;}

/* HEADER */
header{position:sticky; top:0; z-index:10; padding:12px 16px 10px; background:rgba(0,0,0,0.9); backdrop-filter:blur(24px); border-bottom:1px solid rgba(255,255,255,0.08);}
.logo{font-size:30px; font-weight:900; letter-spacing:-1.4px; text-align:center;}
.sentence{text-align:center; margin-top:4px; font-size:10.5px; letter-spacing:0.7px; text-transform:uppercase; font-weight:700; color:rgba(255,255,255,0.35);}
.sentence b{color:rgba(255,255,255,0.9);}
.pill{display:flex; gap:6px; align-items:center; width:fit-content; margin:10px auto 0; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.1); padding:6px 14px; border-radius:999px; font-size:12px;}
.dot{width:8px; height:8px; background:#60A5FA; border-radius:50%; box-shadow:0 0 10px #60A5FA;}
.tabs{display:flex; background:rgba(255,255,255,0.08); border-radius:999px; padding:3px; margin-top:12px;}
.tab{flex:1; border:none; background:none; color:rgba(255,255,255,0.5); padding:10px; border-radius:999px; font-size:14px; font-weight:700; cursor:pointer; transition:.28s cubic-bezier(0.34,1.56,0.64,1);}
.tab.active{background:#fff; color:#000; transform:scale(1.02);}

/* FEED */
main{padding:12px; display:flex; flex-direction:column; gap:12px;}
.post{background:#111113; border:1px solid rgba(255,255,255,0.08); border-radius:22px; padding:16px;}
.meta{font-size:12px; color:rgba(255,255,255,0.45);}
.txt{margin-top:8px; font-size:15px; line-height:21px; font-weight:500;}
.acts{display:flex; gap:20px; margin-top:14px; color:rgba(255,255,255,0.6); font-size:14px;}
.acts button{border:none; background:none; color:inherit; display:flex; align-items:center; gap:6px; font-weight:600; cursor:pointer;}
.upvoted{color:#60A5FA !important;}

.fab{position:fixed; bottom:96px; right:16px; width:58px; height:58px; background:#fff; color:#000; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; box-shadow:0 12px 32px rgba(255,255,255,0.2); cursor:pointer; z-index:5;}
nav.bottom{position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px; display:flex; justify-content:space-around; padding:10px 0 24px; border-top:1px solid rgba(255,255,255,0.08); z-index:20; background:rgba(0,0,0,0.95); backdrop-filter:blur(24px);}
nav.bottom button{border:none; background:none; color:rgba(255,255,255,0.4); display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;}
nav.bottom button.active{color:#fff;}
nav.bottom button span{font-size:10px; font-weight:600;}

/* NEW POST - OLED BLACK */
.new-top{display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid rgba(255,255,255,0.08); background:#000;}
.new-top button{border:none; background:none; color:#fff; font-size:15px; font-weight:600; cursor:pointer;}
.new-top button.postBtn{background:#fff; color:#000; padding:7px 18px; border-radius:999px; transition:.2s;}
.new-top button.postBtn:disabled{opacity:0.25;}
.new-top button.postBtn.loading{background:#333; color:#fff; pointer-events:none;}

textarea{flex:1; width:100%; background:#000; border:none; outline:none; color:#fff; font-size:20px; padding:20px 16px; resize:none; line-height:28px;}
.char{padding:0 16px; text-align:right; font-size:12px; color:rgba(255,255,255,0.3); background:#000;}

/* POP SELECTOR - Campus / General */
.pop-overlay{display:none; position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.6); backdrop-filter:blur(12px); align-items:center; justify-content:center; padding:20px;}
.pop-overlay.show{display:flex;}
.pop-card{width:100%; max-width:340px; background:#111113; border:1px solid rgba(255,255,255,0.12); border-radius:26px; padding:20px; animation:pop .4s cubic-bezier(0.34,1.56,0.64,1);}
.pop-card h3{text-align:center; font-size:16px; font-weight:800; margin-bottom:4px;}
.pop-card p{text-align:center; font-size:12px; opacity:0.5; margin-bottom:16px;}
.choice{display:flex; flex-direction:column; gap:10px;}
.choice button{display:flex; align-items:center; justify-content:space-between; padding:16px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08); border-radius:16px; color:#fff; font-size:14px; font-weight:600; cursor:pointer; transition:.2s;}
.choice button:active{transform:scale(0.97)}
.choice button.selected{background:#fff; color:#000; border-color:#fff;}
.choice button small{display:block; font-size:11px; opacity:0.6; font-weight:500; margin-top:2px;}
.loader-bar{height:3px; background:rgba(255,255,255,0.1); border-radius:999px; overflow:hidden; margin-top:16px; display:none;}
.loader-bar div{height:100%; background:#fff; width:0; animation:load .9s ease forwards;}
.hint{margin:12px; padding:14px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:14px; font-size:12px; line-height:18px; color:rgba(255,255,255,0.6);}

/* DESKTOP */
.desktop-nav,.trending{display:none;}
@media(min-width:900px){
 #viewFeed.active{max-width:1180px; display:grid; grid-template-columns:220px 1fr 300px; gap:18px; padding:18px; background:#000;}
 header{grid-column:1/-1; display:flex; align-items:center; justify-content:space-between; background:#000; border-bottom:1px solid rgba(255,255,255,0.06); padding:10px 0;}
 .tabs{margin:0; width:220px;}
 main{padding:0;}
 nav.bottom,.fab{display:none !important;}
 .desktop-nav{display:flex; flex-direction:column; gap:8px; position:sticky; top:88px; height:fit-content; padding:14px; border-radius:20px;}
 .desktop-nav button{width:100%; display:flex; gap:12px; align-items:center; padding:12px 14px; border-radius:12px; border:none; background:transparent; color:rgba(255,255,255,0.6); font-size:14px; font-weight:600; cursor:pointer; text-align:left;}
 .desktop-nav button.active{background:rgba(255,255,255,0.1); color:#fff;}
 .desktop-nav .newLoopDesk{margin-top:12px; background:#fff; color:#000; justify-content:center; font-weight:800;}
 .trending{display:block; position:sticky; top:88px; height:fit-content; padding:18px; border-radius:20px;}
 #viewProfile.active{max-width:1180px; display:grid; grid-template-columns:220px 1fr 300px; gap:18px; padding:18px; background:#000;}
 #viewNew.active{max-width:430px; margin:0 auto; border:1px solid rgba(255,255,255,0.1);}
}
</style>
</head>
<body>

<div id="viewFeed" class="view active">
 <header><div class="logo">Loop</div><div><div class="sentence">🔒 <b>Anonymous</b> • No names • No history</div><div class="pill glass"><span class="dot"></span><span id="herdLabel">My Herd • 0.2 mi • Campus</span></div></div><div class="tabs glass"><button id="tabCampus" class="tab active">Campus</button><button id="tabGeneral" class="tab">General</button></div></header>
 <div class="desktop-nav glass"><button class="active"><i data-lucide="house"></i> Home</button><button data-go="profile"><i data-lucide="user-round"></i> My Loops</button><button id="deskNew" class="newLoopDesk"><i data-lucide="plus"></i> New Loop</button></div>
 <main id="feed"></main>
 <div class="trending glass"><h4 style="font-size:11px; opacity:0.4; text-transform:uppercase; margin-bottom:12px;">Trending</h4><div style="padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.06);"><b style="font-size:14px;">• Exam week stress</b><br><span style="font-size:12px; opacity:0.5;">128 posts</span></div></div>
 <button id="mobNew" class="fab"><i data-lucide="plus"></i></button>
 <nav class="bottom"><button class="active" data-go="feed"><i data-lucide="house" style="fill:white"></i><span>Home</span></button><button data-go="profile"><i data-lucide="user-round"></i><span>Profile</span></button></nav>
</div>

<div id="viewProfile" class="view">
 <header><div class="logo">My Loops</div><div class="sentence">Only you • Delete anytime</div></header>
 <div class="desktop-nav glass" style="display:flex;"><button data-go="feed"><i data-lucide="house"></i> Home</button><button class="active"><i data-lucide="user-round"></i> My Loops</button><button id="deskNew2" class="newLoopDesk"><i data-lucide="plus"></i> New Loop</button></div>
 <main><div id="myPosts"></div></main>
 <div class="trending glass"><h4 style="font-size:11px; opacity:0.4;">STATS</h4><div style="margin-top:10px;"><b id="count">0 posts</b></div></div>
 <nav class="bottom"><button data-go="feed"><i data-lucide="house"></i><span>Home</span></button><button class="active"><i data-lucide="user-round" style="fill:white"></i><span>Profile</span></button></nav>
</div>

<div id="viewNew" class="view">
 <div class="new-top"><button id="closeNew">Cancel</button><span style="font-weight:800;">New Loop</span><button id="openSelector" class="postBtn" disabled>Post</button></div>
 <textarea id="postInput" maxlength="200" placeholder="What's happening? Share anonymously..."></textarea>
 <div class="char"><span id="char">0</span>/200</div>
 <div class="hint"> Anonymous . No history . You see it only in profile</div>
</div>

<!-- POP CAMPUS/GENERAL -->
<div id="popOverlay" class="pop-overlay">
 <div class="pop-card glass">
  <h3>Where to post?</h3>
  <p>Choose your herd</p>
  <div class="choice">
   <button id="chooseCampus"><span><span>Campus</span><small>My Herd • 0.2 mi • Only campus sees</small></span><i data-lucide="school"></i></button>
   <button id="chooseGeneral"><span><span>General</span><small>Everywhere • All users see</small></span><i data-lucide="globe"></i></button>
  </div>
  <div id="loader" class="loader-bar"><div></div></div>
 </div>
</div>

<script>
lucide.createIcons({attrs:{"stroke-width":1.7}});
let myLoops=[], campus=[{text:"Anyone know if library open 24/7 during finals??",time:"4m",up:128,c:12},{text:"POV: it's 2am and dining hall cookies are elite 🍪",time:"17m",up:92,c:8}], general=[{text:"Free iced coffee in Quad rn!! ☕",time:"6m",up:203,c:25}];
const feedEl=document.getElementById('feed'), myEl=document.getElementById('myPosts'), viewFeed=document.getElementById('viewFeed'), viewProf=document.getElementById('viewProfile'), viewNew=document.getElementById('viewNew'), popOverlay=document.getElementById('popOverlay'), loader=document.getElementById('loader');
let selectedTarget=null;

function renderFeed(){ feedEl.innerHTML=""; let list=document.getElementById('tabCampus').classList.contains('active')?campus:general; list.forEach(p=>{ const d=document.createElement('div'); d.className="post pop"; d.innerHTML=`<div class="meta">anon • ${p.time} ago</div><div class="txt">${p.text}</div><div class="acts"><button class="upBtn"><i data-lucide="arrow-up" style="width:18px"></i><span>${p.up}</span></button><button><i data-lucide="message-circle" style="width:18px"></i><span>${p.c}</span></button></div>`; feedEl.appendChild(d); }); lucide.createIcons({attrs:{"stroke-width":1.7}}); feedEl.querySelectorAll('.upBtn').forEach(b=>{ b.onclick=()=>{ const s=b.querySelector('span'); let n=parseInt(s.textContent); if(b.classList.contains('upvoted')){b.classList.remove('upvoted'); s.textContent=n-1;}else{b.classList.add('upvoted'); s.textContent=n+1; b.classList.add('wiggle'); setTimeout(()=>b.classList.remove('wiggle'),350);} }; }); }
function renderMy(){ document.getElementById('count').textContent=myLoops.length+" posts"; if(myLoops.length===0){ myEl.innerHTML=`<div style="padding:40px; text-align:center; opacity:0.4;">No loops yet.</div>`; return; } myEl.innerHTML=""; myLoops.forEach((p,i)=>{ const d=document.createElement('div'); d.className="post"; d.innerHTML=`<div class="meta">You • ${p.time} • ${p.target} <button data-del="${i}" style="margin-left:auto; border:none; background:none; color:#FF453A; display:flex; gap:4px; font-size:12px; font-weight:600; cursor:pointer;"><i data-lucide="trash-2" style="width:14px"></i> Delete</button></div><div class="txt">${p.text}</div>`; myEl.appendChild(d); }); lucide.createIcons({attrs:{"stroke-width":1.7}}); myEl.querySelectorAll('[data-del]').forEach(b=>{ b.onclick=()=>{ myLoops.splice(parseInt(b.dataset.del),1); renderMy(); }; }); }

document.getElementById('tabCampus').onclick=e=>{ e.target.classList.add('active'); document.getElementById('tabGeneral').classList.remove('active'); document.getElementById('herdLabel').textContent="My Herd • 0.2 mi • Campus"; renderFeed(); };
document.getElementById('tabGeneral').onclick=e=>{ e.target.classList.add('active'); document.getElementById('tabCampus').classList.remove('active'); document.getElementById('herdLabel').textContent="Everywhere • General"; renderFeed(); };

function openNew(){ viewFeed.classList.remove('active'); viewProf.classList.remove('active'); viewNew.classList.add('active'); setTimeout(()=>document.getElementById('postInput').focus(),80); }
function closeNew(){ viewNew.classList.remove('active'); viewFeed.classList.add('active'); popOverlay.classList.remove('show'); }

document.getElementById('mobNew').onclick=openNew; document.getElementById('deskNew').onclick=openNew; document.getElementById('deskNew2').onclick=openNew;
document.getElementById('closeNew').onclick=closeNew;
document.getElementById('postInput').oninput=e=>{ const v=e.target.value.trim(); document.getElementById('char').textContent=e.target.value.length; document.getElementById('openSelector').disabled=v.length===0; };

document.getElementById('openSelector').onclick=()=>{ popOverlay.classList.add('show'); lucide.createIcons({attrs:{"stroke-width":1.7}}); };

function postNow(target){
 selectedTarget=target; loader.style.display="block"; document.querySelectorAll('.choice button').forEach(b=>b.classList.remove('selected')); document.getElementById(target==='campus'?'chooseCampus':'chooseGeneral').classList.add('selected');
 setTimeout(()=>{
  const text=document.getElementById('postInput').value.trim(); if(!text) return;
  myLoops.unshift({text,time:"now",target:target==='campus'?'Campus':'General',seen:10});
  if(target==='campus') campus.unshift({text,time:"now",up:1,c:0}); else general.unshift({text,time:"now",up:1,c:0});
  document.getElementById('postInput').value=""; document.getElementById('char').textContent="0"; document.getElementById('openSelector').disabled=true;
  loader.style.display="none"; popOverlay.classList.remove('show'); closeNew(); renderMy(); renderFeed();
  const toast=document.createElement('div'); toast.textContent=`Posted to ${target==='campus'?'Campus':'General'} anonymously`; toast.style.cssText="position:fixed; bottom:110px; left:50%; transform:translateX(-50%); background:#fff; color:#000; padding:10px 18px; border-radius:999px; font-size:13px; font-weight:700; z-index:60; animation:pop .3s"; document.body.appendChild(toast); setTimeout(()=>toast.remove(),2200);
 },900);
}
document.getElementById('chooseCampus').onclick=()=>postNow('campus');
document.getElementById('chooseGeneral').onclick=()=>postNow('general');
popOverlay.onclick=e=>{ if(e.target===popOverlay) popOverlay.classList.remove('show'); };

document.querySelectorAll('[data-go]').forEach(b=>{ b.onclick=()=>{ const go=b.dataset.go; document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); if(go==='feed'){ viewFeed.classList.add('active'); renderFeed(); }else{ viewProf.classList.add('active'); renderMy(); } }; });

renderFeed(); renderMy();
</script>
</body>
</html>
