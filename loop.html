
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Loop - Swipe Pulse Final</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
body{background:#000;color:#fff;font-family:-apple-system,Inter,sans-serif;overflow-x:hidden}
.glass{backdrop-filter:blur(24px) saturate(180%);background:rgba(22,22,24,0.88);border:1px solid rgba(255,255,255,0.12)}
@keyframes pop{0%{transform:scale(0.88) translateY(20px);opacity:0;filter:blur(8px)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-1deg)}75%{transform:rotate(1deg)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes load{0%{width:0}100%{width:100%}}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}

.view{display:none}
.view.active{display:block}
#viewFeed.active{max-width:430px;margin:0 auto;min-height:100vh;background:#000;padding-top:var(--safe-top);padding-bottom:calc(24px + var(--safe-bottom))}
#viewProfile.active{max-width:430px;margin:0 auto;min-height:100vh;background:#000;padding-top:var(--safe-top);padding-bottom:calc(24px + var(--safe-bottom))}
#viewNew.active{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;padding-top:var(--safe-top);animation:slideUp .35s}

header{position:sticky;top:0;z-index:10;padding:calc(12px + var(--safe-top)) 16px 12px;background:rgba(0,0,0,0.92);backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,0.08)}
.logo{font-size:28px;font-weight:900;letter-spacing:-1.2px;text-align:center}
.sentence{text-align:center;margin-top:4px;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.35);display:flex;gap:6px;justify-content:center;align-items:center}
.pill{display:flex;gap:6px;align-items:center;width:fit-content;margin:10px auto 0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);padding:6px 14px;border-radius:999px;font-size:12px}
.dot{width:8px;height:8px;background:#60A5FA;border-radius:50%}
.tabs{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:3px;margin-top:12px}
.tab{flex:1;border:none;background:none;color:rgba(255,255,255,.5);padding:10px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer}
.tab.active{background:#fff;color:#000}

main{padding:12px;display:flex;flex-direction:column;gap:10px}
.post{background:#111113;border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:16px;animation:pop .36s}
.meta{font-size:11px;color:rgba(255,255,255,.45);display:flex;gap:6px;align-items:center}
.txt{margin-top:8px;font-size:15px;line-height:21px;font-weight:500;white-space:pre-wrap;word-break:break-word}
.acts{display:flex;gap:8px;margin-top:14px;align-items:center}
.acts button{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:rgba(255,255,255,.6);display:flex;align-items:center;gap:5px;font-weight:700;cursor:pointer;padding:7px 14px;border-radius:999px;font-size:13px}
.acts button.upvoted{background:#fff;color:#000;border-color:#fff}
.acts button.downvoted{background:rgba(255,69,58,.15);color:#FF453A;border-color:rgba(255,69,58,.3)}
.score{font-size:13px;font-weight:700;min-width:24px;text-align:center}

/* MOBILE TOP BORDERS - SHOW ON TOP OF POSTS */
.mobile-stack{display:flex;flex-direction:column;gap:8px;padding:10px 12px 0}
.myloops-border{border:1px solid rgba(255,255,255,.1);border-top:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:16px;padding:13px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.myloops-border b{font-size:13px;font-weight:700;display:flex;gap:8px;align-items:center}
.myloops-border small{font-size:12px;opacity:.55}
.myloops-border .right{opacity:.6;display:flex;gap:8px;align-items:center}

/* ROTATING CARD - MOBILE SHOWS DIRECTLY */
.rot-wrap{border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(22,22,24,0.9);overflow:hidden;position:relative;touch-action:pan-y}
.rot-inner{padding:16px;min-height:132px;animation:slideIn .35s}
.rot-inner h4{font-size:11px;letter-spacing:.8px;text-transform:uppercase;opacity:.4;margin-bottom:10px;display:flex;gap:6px;align-items:center}
.rot-inner b{font-size:14px;line-height:19px;display:block}
.rot-inner p{font-size:12px;opacity:.6;margin-top:6px;line-height:16px}
.rot-controls{display:flex;justify-content:space-between;align-items:center;padding:0 12px 12px}
.rot-dots{display:flex;gap:6px}
.rot-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.2);transition:.2s}
.rot-dots span.active{background:#fff;width:16px}
.arrow-btn{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;cursor:pointer}
.arrow-btn:active{transform:scale(0.92)}
.poll-bar{height:8px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;margin-top:10px;display:flex}
.poll-opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.poll-opts button{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.06);color:#fff;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:600;text-align:left;cursor:pointer}
.poll-opts button.voted{background:#fff;color:#000}

/* RIGHT PANEL DESKTOP */
.right-panel{display:none}
.right-panel .rot-wrap{min-height:160px}

/* FAB - MOBILE ONLY */
.fab{position:fixed;bottom:calc(16px + var(--safe-bottom));right:16px;width:56px;height:56px;background:#fff;color:#000;border-radius:50%;border:none;display:grid;place-items:center;cursor:pointer;z-index:20}

.pop-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.62);backdrop-filter:blur(18px);align-items:center;justify-content:center;padding:20px;padding-bottom:calc(20px + var(--safe-bottom))}
.pop-overlay.show{display:flex}
.pop-card{width:100%;max-width:360px;background:#1C1C1E;border:1px solid rgba(255,255,255,.14);border-radius:26px;padding:18px;animation:pop .42s cubic-bezier(0.34,1.56,0.64,1)}
.pop-card.wiggle{animation:pop .42s cubic-bezier(0.34,1.56,0.64,1), wiggle .36s ease .42s}
.pop-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pop-top button{border:none;background:rgba(255,255,255,.08);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;cursor:pointer}
.choice{display:flex;flex-direction:column;gap:10px}
.choice button{display:flex;justify-content:space-between;align-items:center;padding:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;color:#fff;font-weight:600;cursor:pointer}
.choice button.selected{background:#fff;color:#000}
.loader-bar{height:3px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;margin-top:14px;display:none}
.loader-bar div{height:100%;background:#fff;width:0;animation:load .9s forwards}
.new-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.new-top button{border:none;background:none;color:#fff;font-weight:600;cursor:pointer;display:grid;place-items:center}
.postBtn{background:#fff !important;color:#000 !important;padding:7px 18px;border-radius:999px}
.postBtn:disabled{opacity:.25}
textarea{flex:1;width:100%;background:#000;border:none;outline:none;color:#fff;font-size:20px;padding:20px 16px;resize:none}
.char{padding:8px 16px calc(8px + var(--safe-bottom));text-align:right;font-size:12px;color:rgba(255,255,255,.3);border-top:1px solid rgba(255,255,255,.06)}

@media(min-width:900px){
 #viewFeed.active{max-width:1180px;display:grid;grid-template-columns:220px 1fr 320px;gap:18px;padding:18px;padding-top:calc(18px + var(--safe-top))}
 header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
 .tabs{margin:0;width:220px} main{padding:0}
 .mobile-stack{display:none}
 .fab{display:none !important}
 .desktop-nav{display:flex !important;flex-direction:column;gap:8px;position:sticky;top:88px;height:fit-content;padding:14px;border-radius:20px}
 .desktop-nav button{width:100%;display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:none;background:transparent;color:rgba(255,255,255,.6);font-size:14px;font-weight:600;cursor:pointer;text-align:left}
 .desktop-nav button.active{background:rgba(255,255,255,.1);color:#fff}
 .desktop-nav .newLoopDesk{margin-top:12px;background:#fff;color:#000;justify-content:center;font-weight:800}
 .right-panel{display:block;position:sticky;top:88px;height:fit-content}
 #viewProfile.active{max-width:1180px;display:grid;grid-template-columns:220px 1fr 320px;gap:18px;padding:18px;padding-top:calc(18px + var(--safe-top))}
 #viewNew.active{max-width:430px;margin:0 auto;border:1px solid rgba(255,255,255,.1)}
}
@media(max-width:900px){
 .desktop-nav{display:none !important}
 #viewFeed.active,#viewProfile.active{max-width:100%}
 .pop-overlay{align-items:flex-end;padding:12px;padding-bottom:calc(16px + var(--safe-bottom))}
 .pop-card{max-width:100%;border-radius:28px}
}
</style>
</head>
<body>

<div id="viewFeed" class="view active">
 <header><div class="logo">Loop</div><div><div class="sentence"><i data-lucide="shield-check" style="width:14px"></i> <b>Anonymous</b> • No names</div><div class="pill glass"><span class="dot"></span><span id="herdLabel">My Herd • Campus</span></div></div><div class="tabs glass"><button id="tabCampus" class="tab active">Campus</button><button id="tabGeneral" class="tab">General</button></div></header>
 <div class="desktop-nav glass"><button class="active"><i data-lucide="house"></i> Home</button><button data-go="profile"><i data-lucide="user-round"></i> My Loops</button><button id="deskNew" class="newLoopDesk"><i data-lucide="plus"></i> New Loop</button></div>

 <div class="mobile-stack">
   <div class="myloops-border" id="myLoopsBtn"><b><i data-lucide="user-round" style="width:16px"></i> My Loops • <span id="topCount">0</span></b><span class="right"><small>Check yours</small><i data-lucide="chevron-right" style="width:16px"></i></span></div>
   <!-- MOBILE SHOWS DIRECTLY ON TOP OF POSTS - SWIPEABLE -->
   <div class="rot-wrap glass" id="mobileRotWrap">
     <div class="rot-inner" id="mobileRot"></div>
     <div class="rot-controls">
       <button class="arrow-btn" id="prevBtn"><i data-lucide="chevron-left" style="width:18px"></i></button>
       <div class="rot-dots" id="mobileDots"></div>
       <button class="arrow-btn" id="nextBtn"><i data-lucide="chevron-right" style="width:18px"></i></button>
     </div>
   </div>
 </div>

 <main id="feed"></main>
 <div class="right-panel"><div class="rot-wrap glass" id="deskWrap"><div class="rot-inner" id="deskRot"></div><div class="rot-controls"><button class="arrow-btn" id="dPrev"><i data-lucide="chevron-left" style="width:18px"></i></button><div class="rot-dots" id="deskDots"></div><button class="arrow-btn" id="dNext"><i data-lucide="chevron-right" style="width:18px"></i></button></div></div></div>
 <button id="mobNew" class="fab"><i data-lucide="plus"></i></button>
</div>

<div id="viewProfile" class="view">
 <header><div class="logo">My Loops</div><div class="sentence"><i data-lucide="eye-off" style="width:14px"></i> Only you</div></header>
 <div class="desktop-nav glass" style="display:flex;"><button data-go="feed"><i data-lucide="house"></i> Home</button><button class="active"><i data-lucide="user-round"></i> My Loops</button><button id="deskNew2" class="newLoopDesk"><i data-lucide="plus"></i> New Loop</button></div>
 <div class="mobile-stack"><div class="myloops-border" id="backBtn"><b><i data-lucide="chevron-left" style="width:18px"></i> Back to Feed</b><span class="right"><i data-lucide="x" style="width:16px"></i></span></div></div>
 <main><div id="myPosts"></div></main>
 <div class="right-panel"><div class="rot-wrap glass"><div style="padding:16px"><h4 style="font-size:11px;opacity:.4;text-transform:uppercase;margin-bottom:8px">Stats</h4><b id="count">0 posts</b><p style="font-size:12px;opacity:.5;margin-top:6px">Anonymous only you see</p></div></div></div>
</div>

<div id="viewNew" class="view">
 <div class="new-top"><button id="closeNew"><i data-lucide="x" style="width:20px"></i></button><span style="font-weight:800">New Loop</span><button id="openSelector" class="postBtn" disabled>Post</button></div>
 <textarea id="postInput" maxlength="200" placeholder="What's happening? Share anonymously..."></textarea>
 <div class="char"><span id="char">0</span>/200</div>
</div>

<div id="popOverlay" class="pop-overlay">
 <div class="pop-card"><div class="pop-top"><h3>Where to post?</h3><button id="closePop"><i data-lucide="x" style="width:18px"></i></button></div><div class="choice"><button id="chooseCampus"><span><span>Campus</span><small>Only campus sees</small></span><i data-lucide="school"></i></button><button id="chooseGeneral"><span><span>General</span><small>Everywhere</small></span><i data-lucide="globe"></i></button></div><div id="loader" class="loader-bar"><div></div></div></div>
</div>

<script>
lucide.createIcons({attrs:{"stroke-width":1.7}});
let campus=[{id:1,text:"Anyone know if library open 24/7 during finals?",time:"4m",up:128,down:3},{id:2,text:"POV: it is 2am and dining hall cookies are elite",time:"17m",up:92,down:1},{id:4,text:"That lecturer wey dey do attendance 5 mins before class ends",time:"1h",up:245,down:5}], general=[{id:3,text:"Free iced coffee in Quad right now",time:"6m",up:203,down:12}];
let myLoops=[], myVotes={};
let rotIndex=0;
const rotData=[
 {title:"Campus Pulse", html:`<h4><span style="width:6px;height:6px;background:#34C759;border-radius:50%;display:inline-block;margin-right:6px"></span>Live now</h4><b>12 online • 89 loops today</b><p>Vibe: exam stress • 68 percent cramming • Peak: 9pm</p>`},
 {title:"Daily Prompt", html:`<h4><i data-lucide="lightbulb" style="width:12px"></i> Question of day</h4><b>What is the most annoying thing in library?</b><p>Tap answer to post anonymously — 23 people answered today</p><button id="answerPrompt" style="margin-top:12px;border:none;background:#fff;color:#000;padding:8px 14px;border-radius:999px;font-weight:700;font-size:12px;cursor:pointer">Answer anonymously</button>`},
 {title:"Campus Poll", html:`<h4><i data-lucide="bar-chart-2" style="width:12px"></i> Poll • 128 votes</h4><b>Coffee vs Energy drink for finals?</b><div class="poll-bar"><div style="width:62%;background:#fff"></div><div style="width:38%;background:rgba(255,255,255,.2)"></div></div><div class="poll-opts"><button data-poll="c">Coffee • 62 percent</button><button data-poll="e">Energy drink • 38 percent</button></div>`}
];

function renderRot(){
 const cur=rotData[rotIndex];
 document.getElementById('mobileRot').innerHTML=cur.html;
 document.getElementById('deskRot').innerHTML=cur.html;
 document.getElementById('mobileDots').innerHTML=rotData.map((_,i)=>`<span class="${i===rotIndex?'active':''}"></span>`).join('');
 document.getElementById('deskDots').innerHTML=rotData.map((_,i)=>`<span class="${i===rotIndex?'active':''}"></span>`).join('');
 lucide.createIcons();
 let ap=document.getElementById('answerPrompt'); if(ap) ap.onclick=()=>{openNew(); document.getElementById('postInput').value="Library ick: "; document.getElementById('char').textContent=document.getElementById('postInput').value.length; document.getElementById('openSelector').disabled=false;};
 document.querySelectorAll('[data-poll]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-poll]').forEach(x=>x.classList.remove('voted')); b.classList.add('voted');});
}
function nextRot(){rotIndex=(rotIndex+1)%3; renderRot();}
function prevRot(){rotIndex=(rotIndex-1+3)%3; renderRot();}
setInterval(nextRot,20000);
renderRot();

document.getElementById('nextBtn').onclick=nextRot; document.getElementById('prevBtn').onclick=prevRot;
document.getElementById('dNext').onclick=nextRot; document.getElementById('dPrev').onclick=prevRot;

// SWIPE FOR MOBILE
let startX=0; const wrap=document.getElementById('mobileRotWrap');
wrap.addEventListener('touchstart', e=>{startX=e.touches[0].clientX;}, {passive:true});
wrap.addEventListener('touchend', e=>{let dx=e.changedTouches[0].clientX-startX; if(dx<-50) nextRot(); if(dx>50) prevRot();});

const feedEl=document.getElementById('feed'), myEl=document.getElementById('myPosts'), popOverlay=document.getElementById('popOverlay'), loader=document.getElementById('loader');
const viewFeed=document.getElementById('viewFeed'), viewProf=document.getElementById('viewProfile'), viewNew=document.getElementById('viewNew');

function renderFeed(){
 feedEl.innerHTML=""; let list=document.getElementById('tabCampus').classList.contains('active')?campus:general;
 list.forEach(p=>{
   let v=myVotes[p.id]; let d=document.createElement('div'); d.className="post";
   d.innerHTML=`<div class="meta"><i data-lucide="clock-3" style="width:12px"></i> anon • ${p.time}</div><div class="txt">${p.text}</div><div class="acts"><button data-up="${p.id}" class="${v==='up'?'upvoted':''}"><i data-lucide="arrow-up" style="width:16px"></i> ${p.up}</button><span class="score">${p.up-(p.down||0)}</span><button data-down="${p.id}" class="${v==='down'?'downvoted':''}"><i data-lucide="arrow-down" style="width:16px"></i></button></div>`;
   feedEl.appendChild(d);
 });
 lucide.createIcons();
 feedEl.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{let id=b.dataset.up, p=[...campus,...general].find(x=>x.id==id); let cur=myVotes[id]; if(cur==='up'){p.up--; delete myVotes[id];}else{if(cur==='down')p.down--; p.up++; myVotes[id]='up';} renderFeed();});
 feedEl.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>{let id=b.dataset.down, p=[...campus,...general].find(x=>x.id==id); let cur=myVotes[id]; if(cur==='down'){p.down--; delete myVotes[id];}else{if(cur==='up')p.up--; p.down++; myVotes[id]='down';} renderFeed();});
 document.getElementById('topCount').textContent=myLoops.length;
}
function renderMy(){
 document.getElementById('count').textContent=myLoops.length+" posts";
 if(myLoops.length===0){myEl.innerHTML=`<div style="padding:40px;text-align:center;opacity:.4">No loops yet</div>`;return;}
 myEl.innerHTML=""; myLoops.forEach((p,i)=>{let d=document.createElement('div');d.className="post";d.innerHTML=`<div class="meta">You • ${p.time} • ${p.target} <button data-del="${i}" style="margin-left:auto;border:none;background:none;color:#FF453A;display:flex;gap:4px;font-size:12px;font-weight:600;cursor:pointer"><i data-lucide="trash-2" style="width:14px"></i> Delete</button></div><div class="txt">${p.text}</div>`;myEl.appendChild(d);}); lucide.createIcons(); myEl.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{myLoops.splice(parseInt(b.dataset.del),1); renderMy(); renderFeed();});
}
function openNew(){viewFeed.classList.remove('active');viewProf.classList.remove('active');viewNew.classList.add('active');setTimeout(()=>document.getElementById('postInput').focus(),80);}
function closeNew(){viewNew.classList.remove('active');viewFeed.classList.add('active');popOverlay.classList.remove('show');}
document.getElementById('mobNew').onclick=openNew; document.getElementById('deskNew').onclick=openNew; document.getElementById('deskNew2').onclick=openNew;
document.getElementById('closeNew').onclick=closeNew;
document.getElementById('closePop').onclick=()=>popOverlay.classList.remove('show');
popOverlay.onclick=e=>{if(e.target===popOverlay)popOverlay.classList.remove('show');};
document.getElementById('myLoopsBtn').onclick=()=>{viewFeed.classList.remove('active');viewProf.classList.add('active');renderMy();};
document.getElementById('backBtn').onclick=()=>{viewProf.classList.remove('active');viewFeed.classList.add('active');renderFeed();};
document.getElementById('postInput').oninput=e=>{document.getElementById('char').textContent=e.target.value.length;document.getElementById('openSelector').disabled=!e.target.value.trim();};
document.getElementById('openSelector').onclick=()=>{popOverlay.classList.add('show');let c=document.querySelector('.pop-card');c.classList.remove('wiggle');void c.offsetWidth;c.classList.add('wiggle');lucide.createIcons();};
function postNow(t){loader.style.display="block";document.querySelectorAll('.choice button').forEach(b=>b.classList.remove('selected'));document.getElementById(t==='campus'?'chooseCampus':'chooseGeneral').classList.add('selected');setTimeout(()=>{let txt=document.getElementById('postInput').value.trim();if(!txt)return;myLoops.unshift({text:txt,time:"now",target:t==='campus'?'Campus':'General'});if(t==='campus')campus.unshift({id:Date.now(),text:txt,time:"now",up:1,down:0});else general.unshift({id:Date.now(),text:txt,time:"now",up:1,down:0});document.getElementById('postInput').value="";document.getElementById('char').textContent="0";document.getElementById('openSelector').disabled=true;loader.style.display="none";popOverlay.classList.remove('show');closeNew();renderMy();renderFeed();},800);}
document.getElementById('chooseCampus').onclick=()=>postNow('campus');
document.getElementById('chooseGeneral').onclick=()=>postNow('general');
document.getElementById('tabCampus').onclick=e=>{e.target.classList.add('active');document.getElementById('tabGeneral').classList.remove('active');document.getElementById('herdLabel').textContent="My Herd • Campus";renderFeed();};
document.getElementById('tabGeneral').onclick=e=>{e.target.classList.add('active');document.getElementById('tabCampus').classList.remove('active');document.getElementById('herdLabel').textContent="Everywhere • General";renderFeed();};
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const go=b.dataset.go;document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));if(go==='feed'){viewFeed.classList.add('active');renderFeed();}else{viewProf.classList.add('active');renderMy();}});
renderFeed(); renderMy();
</script>
</body>
</html>
