<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Konnekt - New Chat Fake Test</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
  background:#000;
  color:#fff;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* CHAT LOAD LIST - OLED */
.konnekt-app{
  width:100%;
  max-width:420px;
  height:100%;
  margin:0 auto;
  background:#000;
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.konnekt-header{
  height:60px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:#000;
  border-bottom:1px solid #1a1a1a;
  flex-shrink:0;
}
.konnekt-header h1{ font-size:20px; font-weight:700; letter-spacing:-0.3px; }
.konnekt-plus-btn{
  width:36px;
  height:36px;
  border-radius:999px;
  background:#1c1c1e;
  border:none;
  display:grid;
  place-items:center;
  color:#fff;
  cursor:pointer;
  transition:transform.15s;
}
.konnekt-plus-btn:active{ transform:scale(.92); }
.konnekt-plus-icon{ width:20px; height:20px; stroke-width:2.3; }

.konnekt-chat-list{
  flex:1;
  overflow-y:auto;
  background:#000;
  scrollbar-width:none;
}
.konnekt-chat-list::-webkit-scrollbar{ display:none; }

.konnekt-chat-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:12px 16px;
  border-bottom:1px solid #111;
  cursor:pointer;
}
.konnekt-chat-row:active{ background:#111; }
.konnekt-chat-row.fake{ background:#0a0a0a; border-left:3px solid #0a84ff; }
.konnekt-avatar{
  width:48px; height:48px; border-radius:999px;
  background:#1c1c1e;
  display:grid; place-items:center;
  font-size:18px; font-weight:600; color:#fff;
  flex-shrink:0;
}
.konnekt-chat-info{ flex:1; min-width:0; }
.konnekt-chat-name{ font-size:16px; font-weight:600; color:#fff; display:flex; gap:6px; align-items:center; }
.konnekt-fake-badge{ font-size:10px; background:#0a84ff; color:#fff; padding:2px 6px; border-radius:99px; font-weight:700; letter-spacing:.3px; }
.konnekt-chat-last{ font-size:14px; color:#8e8e93; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.konnekt-chat-time{ font-size:12px; color:#8e8e93; }

/* CHAT BACKGROUND - FAKE CHAT OPEN */
.konnekt-chat-bg{
  position:absolute;
  inset:0;
  z-index:15;
  background:#000;
  display:none;
  flex-direction:column;
}
.konnekt-chat-bg.show{ display:flex; }
.konnekt-chat-bg-header{
  height:56px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 12px;
  background:#000;
  border-bottom:1px solid #1a1a1a;
  flex-shrink:0;
}
.konnekt-back-btn{
  width:32px; height:32px; border-radius:999px;
  background:transparent; border:none;
  display:grid; place-items:center; color:#fff; cursor:pointer;
}
.konnekt-chat-messages{
  flex:1;
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:8px;
  background:#000;
  background-image:radial-gradient(circle at 1px 1px, #111 1px, transparent 0);
  background-size:24px 24px;
}
.konnekt-msg{
  max-width:78%;
  padding:10px 14px;
  border-radius:18px;
  font-size:15px;
  line-height:1.35;
  animation: msgPop.28s cubic-bezier(.32,.72,0,1);
}
@keyframes msgPop{ 0%{ transform:scale(.8) translateY(8px); opacity:0; } 100%{ transform:scale(1) translateY(0); opacity:1; } }
.konnekt-msg.me{ align-self:flex-end; background:#0a84ff; color:#fff; border-bottom-right-radius:6px; }
.konnekt-msg.other{ align-self:flex-start; background:#1c1c1e; color:#fff; border-bottom-left-radius:6px; }

.konnekt-chat-input-wrap{
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:#000;
  border-top:1px solid #1a1a1a;
  display:flex;
  align-items:center;
  gap:10px;
  flex-shrink:0;
}
.konnekt-chat-input{
  flex:1;
  background:#1c1c1e;
  border:none;
  border-radius:20px;
  padding:10px 16px;
  color:#fff;
  font-size:15px;
  outline:none;
}
.konnekt-send-btn{
  width:36px; height:36px; border-radius:999px;
  background:#0a84ff; border:none;
  display:grid; place-items:center; color:#fff; cursor:pointer;
}

/* NEW CHAT OVERLAY - IPHONE 17 POP */
.konnekt-newchat-overlay{
  position:absolute;
  inset:0;
  z-index:20;
  background:#000;
  display:none;
}
.konnekt-newchat-overlay.show{ display:block; }
.konnekt-newchat-overlay.second{ z-index:30; }

.konnekt-newchat-sheet{
  width:100%; height:100%;
  background:#000;
  display:flex;
  flex-direction:column;
}

/* MOBILE - SLIDE FROM BOTTOM */
@media (max-width:768px){
 .konnekt-newchat-overlay{ position:fixed; z-index:9999; }
 .konnekt-newchat-overlay.show{ display:flex; align-items:flex-end; }
 .konnekt-newchat-sheet{
    max-height:92dvh;
    border-radius:24px 24px 0 0;
    animation: slideUp.42s cubic-bezier(.32,.72,0,1) forwards;
    background:#000;
  }
  @keyframes slideUp{ 0%{ transform:translateY(100%); } 100%{ transform:translateY(0); } }
 .konnekt-handle{ width:36px; height:4px; border-radius:99px; background:#3a3a3c; margin:10px auto 0; }
}
@media (min-width:769px){
 .konnekt-handle{ display:none; }
 .konnekt-newchat-sheet{ animation: slideLeft.36s cubic-bezier(.32,.72,0,1) forwards; }
  @keyframes slideLeft{ 0%{ transform:translateX(-100%); } 100%{ transform:translateX(0); } }
}

.konnekt-newchat-header{
  position:relative;
  height:56px; min-height:56px;
  display:flex; align-items:center; justify-content:center;
  border-bottom:1px solid #1a1a1a;
  padding:0 16px;
  background:#000;
  flex-shrink:0;
}
.konnekt-newchat-title{ font-size:17px; font-weight:600; color:#fff; }
.konnekt-newchat-close{
  position:absolute; right:16px; top:50%; transform:translateY(-50%);
  width:32px; height:32px; border-radius:999px;
  background:#1c1c1e; border:none; display:grid; place-items:center; color:#fff; cursor:pointer;
}
.konnekt-newchat-back-desktop{
  position:absolute; left:16px; top:50%; transform:translateY(-50%);
  width:32px; height:32px; border-radius:999px;
  background:transparent; border:none; display:none; place-items:center; color:#fff; cursor:pointer;
}
.konnekt-newchat-back-left{
  position:absolute; left:16px; top:50%; transform:translateY(-50%);
  width:32px; height:32px; border-radius:999px;
  background:transparent; border:none; display:grid; place-items:center; color:#fff; cursor:pointer;
}
.konnekt-newchat-mark{
  position:absolute; right:16px; top:50%; transform:translateY(-50%);
  width:32px; height:32px; border-radius:999px;
  background:#0a84ff; border:none; display:grid; place-items:center; color:#fff; cursor:pointer;
}
@media (min-width:769px){
 .konnekt-newchat-close{ display:none; }
 .konnekt-newchat-back-desktop{ display:grid; }
}

.konnekt-search-wrap{ padding:12px 16px; background:#000; }
.konnekt-search{
  display:flex; align-items:center; gap:10px;
  background:#1c1c1e; border-radius:10px; padding:10px 12px;
}
.konnekt-search i{ width:18px; height:18px; color:#8e8e93; flex-shrink:0; }
.konnekt-search input{
  flex:1; background:transparent; border:none; outline:none; color:#fff; font-size:15px;
}
.konnekt-search input::placeholder{ color:#8e8e93; }
.konnekt-id-label{ color:#8e8e93; font-size:15px; font-weight:500; }
.konnekt-konnekting{ display:block; font-size:13px; color:#0a84ff; margin-top:10px; text-align:center; animation: pulse 1s ease-in-out infinite; }
.konnekt-konnekting.hidden{ display:none; }
@keyframes pulse{ 0%,100%{ opacity:.6; } 50%{ opacity:1; } }

.konnekt-list{ padding:8px 0; }
.konnekt-row{
  width:100%; display:flex; align-items:center; gap:12px;
  padding:12px 16px; background:transparent; border:none;
  border-bottom:1px solid #1a1a1a; cursor:pointer; text-align:left;
}
.konnekt-row:active{ background:#1c1c1e; }
.konnekt-row-icon{ width:40px; height:40px; border-radius:999px; display:grid; place-items:center; flex-shrink:0; }
.konnekt-row-icon.green{ background:#24d366; }
.konnekt-row-icon.dark{ background:#1c1c1e; border:1px solid #2c2c2e; }
.konnekt-row-icon i{ width:20px; height:20px; color:#fff; }
.konnekt-row-text{ font-size:16px; font-weight:500; color:#fff; }
.konnekt-members-count{ margin-left:auto; font-size:13px; color:#8e8e93; }
.konnekt-results{ padding:8px 16px; }
.konnekt-empty{ font-size:14px; color:#8e8e93; text-align:center; padding:24px 0; }

.konnekt-members-picker{
  position:absolute; bottom:0; left:0; right:0; max-height:60%;
  background:#1c1c1e; border-radius:20px 20px 0 0;
  padding:12px 0 calc(12px + env(safe-area-inset-bottom));
  overflow-y:auto; animation: slideUp.32s cubic-bezier(.32,.72,0,1) forwards;
}
.konnekt-members-picker.hidden{ display:none; }
.konnekt-picker-handle{ width:36px; height:4px; border-radius:99px; background:#3a3a3c; margin:0 auto 12px; }
.konnekt-picker-title{ font-size:14px; font-weight:600; color:#fff; text-align:center; margin-bottom:12px; }
</style>
</head>
<body>

<div class="konnekt-app" id="app">
  <!-- HEADER -->
  <div class="konnekt-header">
    <h1>Chats</h1>
    <button id="plusBtn" class="konnekt-plus-btn"><i data-lucide="plus" class="konnekt-plus-icon"></i></button>
  </div>

  <!-- CHAT LIST -->
  <div id="chatList" class="konnekt-chat-list"></div>

  <!-- CHAT BACKGROUND - FAKE CHAT -->
  <div id="chatBg" class="konnekt-chat-bg">
    <div class="konnekt-chat-bg-header">
      <button id="chatBackBtn" class="konnekt-back-btn"><i data-lucide="chevron-left"></i></button>
      <div id="chatBgAvatar" class="konnekt-avatar"></div>
      <div style="flex:1"><div id="chatBgName" style="font-weight:600"></div><div style="font-size:12px;color:#8e8e93">tap to test fake chat</div></div>
    </div>
    <div id="chatMessages" class="konnekt-chat-messages"></div>
    <div class="konnekt-chat-input-wrap">
      <input id="chatInput" class="konnekt-chat-input" placeholder="Message" />
      <button id="sendBtn" class="konnekt-send-btn"><i data-lucide="send" style="width:18px;height:18px"></i></button>
    </div>
  </div>

  <!-- NEW CHAT OVERLAY -->
  <div id="newChatOverlay" class="konnekt-newchat-overlay">
    <div class="konnekt-newchat-sheet">
      <div class="konnekt-handle"></div>
      <div class="konnekt-newchat-header">
        <button id="newChatBackDesktop" class="konnekt-newchat-back-desktop"><i data-lucide="chevron-left"></i></button>
        <button id="newChatClose" class="konnekt-newchat-close"><i data-lucide="x"></i></button>
        <h2 class="konnekt-newchat-title">New Chat</h2>
      </div>
      <div class="konnekt-search-wrap">
        <div class="konnekt-search">
          <i data-lucide="search"></i>
          <input id="usernameSearch" type="text" placeholder="Search username" />
        </div>
      </div>
      <div class="konnekt-list">
        <button id="newIdBtn" class="konnekt-row">
          <div class="konnekt-row-icon green"><i data-lucide="hash"></i></div>
          <span class="konnekt-row-text">New ID</span>
        </button>
        <button id="newGroupBtn" class="konnekt-row">
          <div class="konnekt-row-icon dark"><i data-lucide="users"></i></div>
          <span class="konnekt-row-text">New Group</span>
        </button>
        <div id="usernameResults" class="konnekt-results"></div>
      </div>
    </div>
  </div>

  <!-- NEW ID OVERLAY -->
  <div id="newIdOverlay" class="konnekt-newchat-overlay second">
    <div class="konnekt-newchat-sheet">
      <div class="konnekt-handle"></div>
      <div class="konnekt-newchat-header">
        <button id="newIdBack" class="konnekt-newchat-back-left"><i data-lucide="x"></i></button>
        <h2 class="konnekt-newchat-title">New ID</h2>
        <button id="newIdMark" class="konnekt-newchat-mark"><i data-lucide="check"></i></button>
      </div>
      <div class="konnekt-search-wrap">
        <div class="konnekt-search">
          <span class="konnekt-id-label">ID :</span>
          <input id="idInput" type="text" inputmode="numeric" maxlength="6" placeholder="Enter 6 digit ID" />
        </div>
        <span id="konnektingText" class="konnekt-konnekting hidden">Konnekting...</span>
      </div>
    </div>
  </div>

  <!-- NEW GROUP OVERLAY -->
  <div id="newGroupOverlay" class="konnekt-newchat-overlay second">
    <div class="konnekt-newchat-sheet">
      <div class="konnekt-handle"></div>
      <div class="konnekt-newchat-header">
        <button id="newGroupBack" class="konnekt-newchat-back-left"><i data-lucide="x"></i></button>
        <h2 class="konnekt-newchat-title">New Group</h2>
        <button id="newGroupMark" class="konnekt-newchat-mark"><i data-lucide="check"></i></button>
      </div>
      <div class="konnekt-search-wrap">
        <div class="konnekt-search">
          <input id="groupNameInput" type="text" placeholder="Group name" />
        </div>
      </div>
      <div class="konnekt-list">
        <button id="addMembersBtn" class="konnekt-row">
          <div class="konnekt-row-icon green"><i data-lucide="user-plus"></i></div>
          <span class="konnekt-row-text">Add Members</span>
          <span id="membersCount" class="konnekt-members-count"></span>
        </button>
        <div id="membersList" class="konnekt-results"><div class="konnekt-empty">You haven't chatted with anyone yet</div></div>
      </div>
      <div id="membersPicker" class="konnekt-members-picker hidden">
        <div class="konnekt-picker-handle"></div>
        <div class="konnekt-picker-title">Select members</div>
        <div id="chatListPicker" class="konnekt-results"></div>
      </div>
    </div>
  </div>

</div>

<script>
lucide.createIcons();

// FAKE MEMORY ONLY - CLEAR ON REFRESH
let fakeChats = [];
let fakeMessages = {};
let currentChatId = null;
let selectedMembers = [];

function renderChatList(){
  const list = document.getElementById('chatList');
  if(fakeChats.length === 0){
    list.innerHTML = '<div class="konnekt-empty" style="margin-top:40px">No chats yet<br>Tap + to start fake chat</div>';
    return;
  }
  list.innerHTML = fakeChats.map(c => `
    <div class="konnekt-chat-row fake" onclick="openFakeChat('${c.id}')">
      <div class="konnekt-avatar">${c.name[0]}</div>
      <div class="konnekt-chat-info">
        <div class="konnekt-chat-name">${c.name} <span class="konnekt-fake-badge">FAKE</span></div>
        <div class="konnekt-chat-last">${c.lastMessage}</div>
      </div>
      <div class="konnekt-chat-time">now</div>
    </div>
  `).join('');
}

function openFakeChat(id){
  currentChatId = id;
  const chat = fakeChats.find(c=>c.id===id);
  document.getElementById('chatBgAvatar').textContent = chat.name[0];
  document.getElementById('chatBgName').textContent = chat.name;
  document.getElementById('chatBg').classList.add('show');
  renderMessages();
}

function renderMessages(){
  const box = document.getElementById('chatMessages');
  const msgs = fakeMessages[currentChatId] || [];
  box.innerHTML = msgs.map(m => `<div class="konnekt-msg ${m.sender}">${m.text}</div>`).join('');
  box.scrollTop = box.scrollHeight;
}

function createFakeChat(id){
  const chat = {
    id,
    name: `User ${id}`,
    lastMessage: 'Fake chat started - test message',
    isFake: true
  };
  fakeChats.unshift(chat);
  fakeMessages[id] = [{text:`Fake chat with ID ${id} started 🎉`, sender:'other'}];
  renderChatList();
  // close overlays and open chat bg immediately
  document.getElementById('newIdOverlay').classList.remove('show');
  document.getElementById('newChatOverlay').classList.remove('show');
  openFakeChat(id);
}

// PLUS OPEN
document.getElementById('plusBtn').onclick = () => {
  document.getElementById('newChatOverlay').classList.add('show');
  lucide.createIcons();
};
document.getElementById('newChatClose').onclick = () => document.getElementById('newChatOverlay').classList.remove('show');
document.getElementById('newChatBackDesktop').onclick = () => document.getElementById('newChatOverlay').classList.remove('show');

// NEW ID
document.getElementById('newIdBtn').onclick = () => {
  document.getElementById('newIdOverlay').classList.add('show');
  lucide.createIcons();
};
document.getElementById('newIdBack').onclick = () => document.getElementById('newIdOverlay').classList.remove('show');
document.getElementById('newIdMark').onclick = () => {
  const id = document.getElementById('idInput').value.trim();
  if(id.length!== 6 ||!/^\d+$/.test(id)){ alert('Enter 6 digit ID'); return; }
  const txt = document.getElementById('konnektingText');
  txt.classList.remove('hidden');
  setTimeout(()=>{
    txt.classList.add('hidden');
    document.getElementById('idInput').value='';
    createFakeChat(id);
  },1200);
};

// CHAT BG SEND
document.getElementById('sendBtn').onclick = sendFake;
document.getElementById('chatInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendFake(); });
function sendFake(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text ||!currentChatId) return;
  fakeMessages[currentChatId].push({text, sender:'me'});
  renderMessages();
  input.value='';
  // fake auto reply
  setTimeout(()=>{
    fakeMessages[currentChatId].push({text:'This na fake reply for testing 😎', sender:'other'});
    renderMessages();
  },800);
}
document.getElementById('chatBackBtn').onclick = () => {
  document.getElementById('chatBg').classList.remove('show');
  currentChatId = null;
};

// GROUP - FAKE ONLY
document.getElementById('newGroupBtn').onclick = () => {
  document.getElementById('newGroupOverlay').classList.add('show');
  loadPicker();
  lucide.createIcons();
};
document.getElementById('newGroupBack').onclick = () => document.getElementById('newGroupOverlay').classList.remove('show');
document.getElementById('addMembersBtn').onclick = () => {
  document.getElementById('membersPicker').classList.remove('hidden');
};
function loadPicker(){
  const picker = document.getElementById('chatListPicker');
  if(fakeChats.length===0){
    picker.innerHTML = '<div class="konnekt-empty">You haven\'t chatted with anyone yet</div>';
    document.getElementById('membersList').innerHTML = '<div class="konnekt-empty">You haven\'t chatted with anyone yet</div>';
    return;
  }
  picker.innerHTML = fakeChats.map(c=>`
    <button class="konnekt-row" onclick="toggleMember('${c.id}')">
      <div class="konnekt-row-icon dark">${c.name[0]}</div>
      <span class="konnekt-row-text">${c.name}</span>
    </button>
  `).join('');
  document.getElementById('membersList').innerHTML = fakeChats.slice(0,3).map(c=>`
    <div class="konnekt-chat-row"><div class="konnekt-avatar">${c.name[0]}</div><div class="konnekt-chat-info"><div class="konnekt-chat-name">${c.name}</div></div></div>
  `).join('');
}
window.toggleMember = (id) => {
  if(selectedMembers.includes(id)) selectedMembers = selectedMembers.filter(x=>x!==id);
  else selectedMembers.push(id);
  document.getElementById('membersCount').textContent = selectedMembers.length? `${selectedMembers.length} selected` : '';
};

// INIT
renderChatList();
</script>
</body>
</html>
